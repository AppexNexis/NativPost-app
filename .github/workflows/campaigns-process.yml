name: Drain Campaign Generation Queue

# BACKSTOP, not the primary runner. Campaign generation is dispatched to
# Inngest (see src/lib/inngest/functions/campaign-generate.ts), which drives a
# job to completion as durable chunk steps. This workflow exists so a job can
# never be stranded when Inngest is unconfigured, unreachable, or a run dies:
# each POST claims one queued job and works it until its time budget is spent,
# then parks it back on the queue with progress intact. A large campaign is
# therefore finished by successive ticks even with no other runner involved.
#
# GitHub's scheduler is best-effort and routinely runs late under load. That is
# acceptable for a backstop; it is why it is not the primary path.
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Drain one queued job
        run: |
          curl -X POST \
            https://app.nativpost.com/api/cron/campaigns/process \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --fail \
            --silent \
            --show-error
